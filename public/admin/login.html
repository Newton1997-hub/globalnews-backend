<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlobalNews Login</title><link rel="stylesheet" href="/assets/admin.css"></head><body><div class="login"><div class="card"><div class="brand" style="color:#101d2d">Global<span>News</span><small>Admin Panel</small></div><h1>Sign in</h1><form id="login" class="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn">Sign in</button><div id="error" style="color:#cf3044;font-size:12px"></div></form></div></div><script src="/assets/admin.js"></script><script>login.onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});location.href='/admin/'}catch(err){error.textContent=err.message}}</script></body></html>
