<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categories</title><link rel="stylesheet" href="/assets/admin.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand">Global<span>News</span><small>Admin Panel</small></div><nav class="nav"><a href="/admin/">Dashboard</a><a href="/admin/posts.html">Posts</a><a class="active" href="/admin/categories.html">Categories</a><a href="/admin/users.html">Users</a><a href="/admin/settings.html">Settings</a></nav></aside><main class="main"><header class="top"><h1>Categories</h1></header><section class="content"><div class="grid"><div class="card"><h2>Add Category</h2><form id="form" class="form"><label>Name<input id="name" required></label><label>Description<textarea id="description" style="min-height:100px"></textarea></label><button class="btn">Create</button></form></div><div class="card"><h2>Categories</h2><table class="table"><thead><tr><th>Name</th><th>Slug</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div id="toast" class="toast"></div><script src="/assets/admin.js"></script><script>async function load(){const d=await api('/api/categories');rows.innerHTML=d.map(x=>`<tr><td>${x.name}</td><td>${x.slug}</td><td><button class="btn danger" onclick="del(${x.id})">Delete</button></td></tr>`).join('')}async function del(id){if(confirm('Delete category?')){await api('/api/categories/'+id,{method:'DELETE'});toast('Deleted');load()}}form.onsubmit=async e=>{e.preventDefault();await api('/api/categories',{method:'POST',body:JSON.stringify({name:name.value,description:description.value})});toast('Created');form.reset();load()};(async()=>{if(await requireUser())load()})()</script></body></html>
