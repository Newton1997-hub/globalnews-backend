<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users</title><link rel="stylesheet" href="/assets/admin.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand">Global<span>News</span><small>Admin Panel</small></div><nav class="nav"><a href="/admin/">Dashboard</a><a href="/admin/posts.html">Posts</a><a href="/admin/categories.html">Categories</a><a class="active" href="/admin/users.html">Users</a><a href="/admin/settings.html">Settings</a></nav></aside><main class="main"><header class="top"><h1>Users & Roles</h1></header><section class="content"><div class="grid"><div class="card"><h2>Add User</h2><form id="form" class="form"><label>Name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><label>Role<select id="role"><option>editor</option><option>author</option><option>admin</option></select></label><button class="btn">Create User</button></form></div><div class="card"><h2>Users</h2><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div id="toast" class="toast"></div><script src="/assets/admin.js"></script><script>async function load(){const d=await api('/api/users');rows.innerHTML=d.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td><span class="pill">${x.role}</span></td></tr>`).join('')}form.onsubmit=async e=>{e.preventDefault();try{await api('/api/users',{method:'POST',body:JSON.stringify({name:name.value,email:email.value,password:password.value,role:role.value})});toast('Created');form.reset();load()}catch(err){toast(err.message)}};(async()=>{if(await requireUser())load()})()</script></body></html>
